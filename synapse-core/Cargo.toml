[package]
name = "synapse-core"
version = "0.1.0"
edition = "2021"

[dependencies]
bitvec = "1.0"
wgpu = "0.19.1"
pollster = "0.3.0"
bytemuck = { version = "1.24.0", features = ["derive"] }
glam = "0.24"
egui = "0.27.2"
egui-wgpu = "0.27.2"
egui-winit = "0.27.2"
winit = "0.29.15"
thiserror = "1.0"
mlua = { version = "0.11.5", features = ["lua54", "vendored"] }
image = { version = "0.25.1", default-features = true }
tobj = { version = "4.0.0", features = ["log"] }
log = "0.4"
